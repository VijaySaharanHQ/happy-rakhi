<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classified Sibling Vault 🔒</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            cursor: none !important; 
            box-sizing: border-box;
            user-select: none; /* Prevents text highlighting while holding */
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Main background starts black for the scanner, transitions to image later */
            background-color: #000;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            perspective: 1200px;
            transition: background 2s ease;
        }

        /* The Class for the real background image (Added via JS later) */
        .unlocked-bg {
            background-image: linear-gradient(rgba(10, 10, 20, 0.75), rgba(10, 10, 20, 0.75)), url('pic7.jpg') !important;
            background-size: cover !important;
            background-position: center !important;
        }

        /* --- STAGE 1: THE SCANNER UI --- */
        #scanner-screen {
            position: absolute;
            z-index: 100;
            width: 100%;
            height: 100vh;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease;
        }

        .terminal-text {
            font-family: 'Courier Prime', monospace;
            color: #0f0; /* Hacker green */
            font-size: 1.2rem;
            margin-bottom: 40px;
            text-align: center;
            min-height: 80px;
            text-shadow: 0 0 5px #0f0;
        }

        .fingerprint-btn {
            width: 120px;
            height: 150px;
            border: 2px dashed #333;
            border-radius: 60px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: border-color 0.3s ease;
        }

        /* The Fingerprint SVG Icon */
        .fingerprint-icon {
            width: 80px;
            height: 100px;
            fill: #333; /* Dark initially */
            transition: fill 0.3s ease;
        }

        /* The Scanning Laser Line */
        .laser {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #0f0;
            box-shadow: 0 0 15px #0f0, 0 0 30px #0f0;
            opacity: 0;
            transform: translateY(-10px);
        }

        /* Animation when user holds down */
        .scanning .laser {
            opacity: 1;
            animation: scanMove 2.5s ease-in-out forwards;
        }
        .scanning .fingerprint-icon { fill: #0f0; filter: drop-shadow(0 0 10px #0f0); }
        .scanning { border-color: #0f0; box-shadow: 0 0 30px rgba(0, 255, 0, 0.2); }

        @keyframes scanMove {
            0% { transform: translateY(0); }
            50% { transform: translateY(140px); }
            100% { transform: translateY(0); }
        }

        .hold-instruction {
            margin-top: 30px;
            font-size: 1rem;
            color: #777;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* --- STAGE 2: THE FESTIVE UI (Hidden initially) --- */
        #festive-ui { display: none; }

        .custom-cursor {
            position: fixed; top: 0; left: 0; width: 50px; height: 50px;
            background-image: url('rakhi.png'); 
            background-size: contain; background-repeat: no-repeat; background-position: center;
            pointer-events: none; transform: translate(-50%, -50%); z-index: 9999;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8)); transition: transform 0.15s ease-out; 
            display: none; /* Hidden during scan */
        }

        .sparkle {
            position: fixed; width: 8px; height: 8px; background: #ffd700; border-radius: 50%;
            pointer-events: none; box-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00;
            animation: fadeSparkle 0.8s forwards; z-index: 9998; transform: translate(-50%, -50%);
        }
        @keyframes fadeSparkle {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        .petal {
            position: absolute; top: -50px; background: #ffa500; border-radius: 15px 0 15px 0; 
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5); opacity: 0.8; z-index: 5;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; } 90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        #main-card {
            width: 90%; max-width: 520px; background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4); border-radius: 25px;
            padding: 45px 35px; text-align: center; z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
            transform-style: preserve-3d; opacity: 0; transform: perspective(1200px) translateY(80px) scale(0.8);
        }

        .gallery-wrapper {
            width: 100%; height: 180px; overflow: hidden; border-radius: 15px; margin-bottom: 25px;
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            transform: translateZ(50px); 
        }

        .slider-track {
            display: flex; gap: 20px; width: max-content; animation: slideGallery 35s linear infinite alternate;
        }

        .slider-track img {
            width: 180px; height: 180px; object-fit: cover; border-radius: 15px;
            border: 3px solid rgba(255, 215, 0, 0.6); box-shadow: 0 15px 25px rgba(0,0,0,0.4); pointer-events: none; 
        }

        @keyframes slideGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-100% + 400px)); } 
        }

        h1 {
            font-family: 'Great Vibes', cursive; font-size: 4rem; margin: 0 0 5px 0;
            background: linear-gradient(90deg, #FFD700, #FFF8DC, #FF8C00, #FFD700);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: goldShine 4s linear infinite; filter: drop-shadow(0 5px 15px rgba(255, 215, 0, 0.4));
            transform: translateZ(60px);
        }
        @keyframes goldShine { to { background-position: 200% center; } }

        h2 { font-weight: 300; font-size: 1.1rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 30px; transform: translateZ(40px); }
        .typewriter-text { font-size: 1.1rem; line-height: 1.8; min-height: 120px; margin-bottom: 25px; transform: translateZ(45px); text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .signature { font-family: 'Great Vibes', cursive; font-size: 2.2rem; color: #FF7F50; opacity: 0; transition: opacity 1.5s ease; transform: translateZ(35px); text-shadow: 0 0 10px rgba(255, 127, 80, 0.5); }
    </style>
</head>
<body>

    <!-- Audio -->
    <audio id="bg-music" loop><source src="music.mp3" type="audio/mpeg"></audio>

    <!-- STAGE 1: Biometric Scanner Screen -->
    <div id="scanner-screen">
        <div class="terminal-text" id="terminal">System Locked.<br>Awaiting Identity Verification...</div>
        
        <div class="fingerprint-btn" id="scan-btn">
            <!-- Fingerprint SVG -->
            <svg class="fingerprint-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.52.25.13.34.43.21.67-.09.18-.26.28-.44.28zM3.5 9.72c-.1 0-.2-.03-.29-.09-.23-.16-.28-.47-.12-.7.99-1.4 2.25-2.5 3.75-3.27C9.98 4.04 10.99 3.8 12 3.8c1.01 0 2.02.24 3.16.7 1.5.6 2.76 1.7 3.75 3.1.16.23.11.54-.12.7-.23.16-.54.11-.7-.12-.9-1.26-2.04-2.25-3.39-2.79-1.02-.41-1.92-.61-2.7-.61-.78 0-1.68.2-2.7.61-1.35.54-2.49 1.53-3.39 2.79-.15.22-.39.34-.61.34zM12 22c-.13 0-.26-.05-.35-.15-.87-.87-1.34-1.43-2.01-2.64-.69-1.23-1.05-2.73-1.05-4.34 0-2.97 2.54-5.39 5.66-5.39s5.66 2.42 5.66 5.39c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.42-2.09-4.39-4.66-4.39s-4.66 1.97-4.66 4.39c0 1.44.32 2.77.93 3.85.6 1.08 1.01 1.59 1.83 2.4.19.19.19.51 0 .7-.1.1-.23.15-.35.15z"/>
                <path d="M7 21c-.13 0-.26-.05-.35-.15-.19-.19-.19-.51 0-.7.66-.66 1.09-1.15 1.63-2.12.54-.97.82-2.22.82-3.64 0-3.53 2.97-6.4 6.62-6.4s6.62 2.87 6.62 6.4c0 .28-.22.5-.5.5s-.5-.22-.5-.5c0-2.98-2.52-5.4-5.62-5.4s-5.62 2.42-5.62 5.4c0 1.25-.25 2.37-.73 3.23-.49.88-.87 1.32-1.48 1.93-.11.1-.23.15-.39.15z"/>
            </svg>
            <div class="laser"></div>
        </div>
        <div class="hold-instruction">Press and Hold to Scan</div>
    </div>

    <!-- STAGE 2: Festive UI (Everything from before!) -->
    <div class="custom-cursor" id="cursor"></div>
    <div id="petals-container"></div>

    <div id="festive-ui">
        <div id="main-card">
            <h1>Happy Rakhi</h1>
            <h2>[Sister's Name]</h2>
            
            <div class="gallery-wrapper">
                <div class="slider-track">
                    <img src="pic1.jpg" alt="Memory"><img src="pic2.jpg" alt="Memory"><img src="pic3.jpg" alt="Memory">
                    <img src="pic4.jpg" alt="Memory"><img src="pic5.jpg" alt="Memory"><img src="pic6.jpg" alt="Memory">
                    <img src="pic7.jpg" alt="Memory"><img src="pic8.jpg" alt="Memory"><img src="pic9.jpg" alt="Memory">
                    <img src="pic10.jpg" alt="Memory"><img src="pic11.jpg" alt="Memory"><img src="pic12.jpg" alt="Memory">
                    <img src="pic13.jpg" alt="Memory"><img src="pic14.jpg" alt="Memory"><img src="pic15.jpg" alt="Memory">
                </div>
            </div>
            
            <div class="typewriter-text" id="message"></div>
            <div class="signature" id="signature">Love, [Your Name] ❤️</div>
        </div>
    </div>

    <script>
        // --- SCANNER LOGIC ---
        const scanBtn = document.getElementById('scan-btn');
        const terminal = document.getElementById('terminal');
        const scannerScreen = document.getElementById('scanner-screen');
        const festiveUi = document.getElementById('festive-ui');
        const mainCard = document.getElementById('main-card');
        const customCursor = document.getElementById('cursor');
        
        let scanTimer;
        let scanProgress = 0;
        let isScanning = false;

        const terminalMessages = [
            "Initiating biometric scan...",
            "Analyzing Sibling DNA sequence...",
            "Warning: High levels of Annoyance detected...",
            "Checking loyalty matrix...",
            "Verdict: World's Best Sister confirmed.",
            "Unlocking Memory Vault..."
        ];

        // Trigger on Mouse Down or Touch Hold
        scanBtn.addEventListener('mousedown', startScan);
        scanBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startScan(); });

        // Trigger on Mouse Up or Touch Release
        window.addEventListener('mouseup', stopScan);
        window.addEventListener('touchend', stopScan);

        function startScan() {
            if (scanProgress >= terminalMessages.length) return; // Already unlocked
            isScanning = true;
            scanBtn.classList.add('scanning');
            
            // Cycle through messages while holding
            scanTimer = setInterval(() => {
                if (scanProgress < terminalMessages.length) {
                    terminal.innerHTML = terminalMessages[scanProgress];
                    scanProgress++;
                }
                
                if (scanProgress === terminalMessages.length) {
                    clearInterval(scanTimer);
                    unlockVault();
                }
            }, 800); // Wait 0.8s per message (approx 4.8 seconds total hold)
        }

        function stopScan() {
            if (!isScanning || scanProgress >= terminalMessages.length) return;
            isScanning = false;
            clearInterval(scanTimer);
            scanBtn.classList.remove('scanning');
            scanProgress = 0;
            terminal.innerHTML = "Scan interrupted.<br>Please hold finger steady.";
            terminal.style.color = "#ff3333"; // Red error
            setTimeout(() => { 
                if(!isScanning) {
                    terminal.style.color = "#0f0";
                    terminal.innerHTML = "System Locked.<br>Awaiting Identity Verification...";
                }
            }, 1500);
        }

        function unlockVault() {
            isScanning = false;
            scanBtn.classList.remove('scanning');
            
            // Fade out scanner
            scannerScreen.style.opacity = '0';
            
            // Change background image dynamically
            document.body.classList.add('unlocked-bg');
            
            // Start Music
            const music = document.getElementById('bg-music');
            music.volume = 0.5; 
            music.play().catch(e => console.log("Audio play prevented"));

            setTimeout(() => {
                scannerScreen.style.display = 'none';
                festiveUi.style.display = 'block';
                customCursor.style.display = 'block'; // Show Rakhi cursor
                
                // Show Card Animation
                mainCard.animate([
                    { opacity: 0, transform: 'perspective(1200px) translateY(80px) scale(0.8)' },
                    { opacity: 1, transform: 'perspective(1200px) translateY(0) scale(1)' }
                ], { duration: 1500, easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)', fill: 'forwards' });
                
                createPetals();
                setTimeout(typeWriter, 1200);
            }, 1000);
        }

        // --- RAKHI CURSOR & FESTIVE LOGIC (From before) ---
        let lastSparkleTime = 0;
        document.addEventListener('mousemove', (e) => {
            if (customCursor.style.display === 'none') return; // Don't show during scan
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
            
            const now = Date.now();
            if (now - lastSparkleTime > 30) {
                createSparkle(e.clientX, e.clientY);
                lastSparkleTime = now;
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const offsetX = (Math.random() - 0.5) * 20;
            const offsetY = (Math.random() - 0.5) * 20;
            sparkle.style.left = (x + offsetX) + 'px'; sparkle.style.top = (y + offsetY) + 'px';
            const colors = ['#FFD700', '#FFA500', '#FF8C00', '#FFF8DC'];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
            document.body.appendChild(sparkle);
            setTimeout(() => { sparkle.remove(); }, 800);
        }

        mainCard.addEventListener('mousemove', (e) => {
            const rect = mainCard.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;
            const rotateX = -y / 20; const rotateY = x / 20;
            mainCard.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        mainCard.addEventListener('mouseleave', () => {
            mainCard.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg)`;
        });

        function createPetals() {
            const container = document.getElementById('petals-container');
            const colors = ['#FFa500', '#FF8c00', '#FFd700'];
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.width = (Math.random() * 10 + 10) + 'px';
                    petal.style.height = (Math.random() * 10 + 10) + 'px';
                    petal.style.background = colors[Math.floor(Math.random() * colors.length)];
                    petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                    container.appendChild(petal);
                }, i * 200);
            }
        }

        const textToType = "Thank you for being my built-in best friend, my protector, and the most annoying person I love. I coded this just for you today. You mean the world to me!";
        const speed = 50; let typeIndex = 0;

        function typeWriter() {
            if (typeIndex < textToType.length) {
                document.getElementById("message").innerHTML += textToType.charAt(typeIndex);
                typeIndex++;
                setTimeout(typeWriter, speed);
            } else {
                document.getElementById("signature").style.opacity = '1';
            }
        }
    </script>
</body>
</html>
