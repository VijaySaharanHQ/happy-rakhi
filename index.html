<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Magical Surprise For You! 🎁</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* 1. Global Reset & Hide Default Cursor */
        * {
            cursor: none !important; 
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            /* --- BACKGROUND IMAGE UPDATED TO pic7.jpg --- */
            background-image: linear-gradient(rgba(10, 10, 20, 0.75), rgba(10, 10, 20, 0.75)), url('pic7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
            perspective: 1200px;
        }

        /* 2. Custom RAKHI Mouse Cursor */
        .custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 50px; height: 50px;
            background-image: url('rakhi.png'); /* Upload rakhi.png to GitHub */
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            pointer-events: none; 
            transform: translate(-50%, -50%);
            z-index: 9999;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
            transition: transform 0.15s ease-out; 
        }

        /* Magical Sparkle Particle */
        .sparkle {
            position: fixed;
            width: 8px; height: 8px;
            background: #ffd700;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 15px #ffd700, 0 0 30px #ff8c00;
            animation: fadeSparkle 0.8s forwards;
            z-index: 9998;
            transform: translate(-50%, -50%);
        }

        @keyframes fadeSparkle {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        }

        /* 3. Glowing Orbs Background (Still kept for magic effect!) */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }
        .orb-1 { width: 400px; height: 400px; background: rgba(255, 65, 108, 0.4); top: -100px; left: -100px; }
        .orb-2 { width: 500px; height: 500px; background: rgba(255, 140, 0, 0.3); bottom: -150px; right: -100px; animation-delay: -6s; }
        .orb-3 { width: 300px; height: 300px; background: rgba(138, 43, 226, 0.3); top: 40%; left: 40%; animation-delay: -3s; }

        @keyframes floatOrb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(40px, -40px); }
        }

        /* Falling Petals Effect */
        .petal {
            position: absolute;
            top: -50px;
            background: #ffa500;
            border-radius: 15px 0 15px 0; 
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
            opacity: 0.8;
            z-index: 5;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        /* 4. The "Unwrap" Screen */
        #intro-screen {
            position: absolute;
            z-index: 50;
            text-align: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .unwrap-btn {
            background: linear-gradient(45deg, #FFaa00, #FF5500);
            border: 2px solid #ffd700;
            padding: 18px 50px;
            font-size: 1.6rem;
            color: white;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 0 25px rgba(255, 170, 0, 0.6);
            animation: pulseBtn 2s infinite;
            transition: transform 0.3s ease;
        }

        .unwrap-btn:hover { transform: scale(1.15); }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 20px rgba(255, 170, 0, 0.4); }
            50% { box-shadow: 0 0 45px rgba(255, 170, 0, 0.9), 0 0 20px rgba(255, 255, 255, 0.6); }
            100% { box-shadow: 0 0 20px rgba(255, 170, 0, 0.4); }
        }

        /* 5. The Premium 3D Glass Card */
        #main-card {
            display: none; 
            width: 90%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 215, 0, 0.4); 
            border-radius: 25px;
            padding: 45px 35px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2);
            transition: transform 0.15s ease-out; 
            transform-style: preserve-3d;
        }

        /* 6. Auto-Sliding Image Gallery */
        .gallery-wrapper {
            width: 100%;
            height: 180px;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 25px;
            -webkit-mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            mask-image: linear-gradient(to right, transparent, black 15%, black 85%, transparent);
            transform: translateZ(50px); 
        }

        .slider-track {
            display: flex;
            gap: 20px;
            width: max-content;
            animation: slideGallery 35s linear infinite alternate;
        }

        .slider-track img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 15px;
            border: 3px solid rgba(255, 215, 0, 0.6);
            box-shadow: 0 15px 25px rgba(0,0,0,0.4);
            pointer-events: none; 
        }

        @keyframes slideGallery {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(-100% + 400px)); } 
        }

        /* 7. Typography */
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            margin: 0 0 5px 0;
            background: linear-gradient(90deg, #FFD700, #FFF8DC, #FF8C00, #FFD700);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: goldShine 4s linear infinite;
            filter: drop-shadow(0 5px 15px rgba(255, 215, 0, 0.4));
            transform: translateZ(60px);
        }

        @keyframes goldShine {
            to { background-position: 200% center; }
        }

        h2 {
            font-weight: 300;
            font-size: 1.1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #f0f0f0;
            margin-bottom: 30px;
            transform: translateZ(40px);
        }

        .typewriter-text {
            font-size: 1.1rem;
            line-height: 1.8;
            color: #fff;
            min-height: 120px; 
            margin-bottom: 25px;
            transform: translateZ(45px);
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 2.2rem;
            color: #FF7F50;
            opacity: 0; 
            transition: opacity 1.5s ease;
            transform: translateZ(35px);
            text-shadow: 0 0 10px rgba(255, 127, 80, 0.5);
        }
    </style>
</head>
<body>

    <!-- Hidden Background Audio (Starts on Click) -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Glowing Orbs (They will float nicely over your background image) -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Container for Petals -->
    <div id="petals-container"></div>

    <!-- Custom Cursor -->
    <div class="custom-cursor" id="cursor"></div>

    <!-- Screen 1: The Intro Button -->
    <div id="intro-screen">
        <button class="unwrap-btn" id="unwrap-btn" onclick="revealSurprise()">Tap to open your gift 🎁</button>
    </div>

    <!-- Screen 2: The Main 3D Card -->
    <div id="main-card">
        <h1>Happy Rakhi</h1>
        <h2>[Sister's Name]</h2>
        
        <div class="gallery-wrapper">
            <div class="slider-track">
                <!-- UPDATED IMAGES: pic1.jpg to pic15.jpg -->
                <img src="pic1.jpg" alt="Memory">
                <img src="pic2.jpg" alt="Memory">
                <img src="pic3.jpg" alt="Memory">
                <img src="pic4.jpg" alt="Memory">
                <img src="pic5.jpg" alt="Memory">
                <img src="pic6.jpg" alt="Memory">
                <img src="pic7.jpg" alt="Memory">
                <img src="pic8.jpg" alt="Memory">
                <img src="pic9.jpg" alt="Memory">
                <img src="pic10.jpg" alt="Memory">
                <img src="pic11.jpg" alt="Memory">
                <img src="pic12.jpg" alt="Memory">
                <img src="pic13.jpg" alt="Memory">
                <img src="pic14.jpg" alt="Memory">
                <img src="pic15.jpg" alt="Memory">
            </div>
        </div>
        
        <div class="typewriter-text" id="message"></div>
        <div class="signature" id="signature">Love, [Your Name] ❤️</div>
    </div>

    <script>
        // --- 1. Magical Sparkle Cursor Logic ---
        const cursor = document.getElementById('cursor');
        const unwrapBtn = document.getElementById('unwrap-btn');
        let lastSparkleTime = 0;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            
            const now = Date.now();
            if (now - lastSparkleTime > 30) {
                createSparkle(e.clientX, e.clientY);
                lastSparkleTime = now;
            }
        });

        function createSparkle(x, y) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            const offsetX = (Math.random() - 0.5) * 20;
            const offsetY = (Math.random() - 0.5) * 20;
            
            sparkle.style.left = (x + offsetX) + 'px';
            sparkle.style.top = (y + offsetY) + 'px';
            
            const colors = ['#FFD700', '#FFA500', '#FF8C00', '#FFF8DC'];
            sparkle.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            document.body.appendChild(sparkle);
            
            setTimeout(() => { sparkle.remove(); }, 800);
        }

        unwrapBtn.addEventListener('mouseenter', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(1.4) rotate(-15deg)';
        });
        unwrapBtn.addEventListener('mouseleave', () => {
            cursor.style.transform = 'translate(-50%, -50%) scale(1) rotate(0deg)';
        });

        // --- 2. 3D Card Hover Effect ---
        const card = document.getElementById('main-card');

        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const rotateX = -y / 20; 
            const rotateY = x / 20;

            card.style.transform = `perspective(1200px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        card.addEventListener('mouseleave', () => {
            card.style.transform = `perspective(1200px) rotateX(0deg) rotateY(0deg)`;
        });

        // --- 3. Falling Petals Generator ---
        function createPetals() {
            const container = document.getElementById('petals-container');
            const colors = ['#FFa500', '#FF8c00', '#FFd700'];
            
            for (let i = 0; i < 40; i++) {
                setTimeout(() => {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    petal.style.left = Math.random() * 100 + 'vw';
                    petal.style.width = (Math.random() * 10 + 10) + 'px';
                    petal.style.height = (Math.random() * 10 + 10) + 'px';
                    petal.style.background = colors[Math.floor(Math.random() * colors.length)];
                    petal.style.animationDuration = (Math.random() * 5 + 5) + 's';
                    container.appendChild(petal);
                }, i * 200);
            }
        }

        // --- 4. Reveal, Music & Typewriter Logic ---
        const textToType = "Thank you for being my built-in best friend, my protector, and the most annoying person I love. I coded this just for you today. You mean the world to me!";
        const speed = 50; 
        let i = 0;

        function revealSurprise() {
            const music = document.getElementById('bg-music');
            music.volume = 0.5; 
            music.play().catch(e => console.log("Audio play prevented until interaction"));

            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            
            setTimeout(() => {
                intro.style.display = 'none';
                
                card.style.display = 'block';
                card.animate([
                    { opacity: 0, transform: 'perspective(1200px) translateY(80px) scale(0.8)' },
                    { opacity: 1, transform: 'perspective(1200px) translateY(0) scale(1)' }
                ], {
                    duration: 1500,
                    easing: 'cubic-bezier(0.2, 0.8, 0.2, 1)',
                    fill: 'forwards'
                });
                
                createPetals();
                setTimeout(typeWriter, 1200);
            }, 800); 
        }

        function typeWriter() {
            if (i < textToType.length) {
                document.getElementById("message").innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            } else {
                document.getElementById("signature").style.opacity = '1';
            }
        }
    </script>

</body>
</html>
