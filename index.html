<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Surprise For You! 🎁</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        /* 1. Deep Animated Background */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: #0f0c29; /* Deep space dark */
            background: linear-gradient(to right, #24243e, #302b63, #0f0c29);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            overflow: hidden;
        }

        /* Animated background glowing orbs */
        .bg-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            animation: floatOrb 10s infinite alternate ease-in-out;
        }
        .orb-1 { width: 300px; height: 300px; background: #ff416c; top: -50px; left: -50px; }
        .orb-2 { width: 400px; height: 400px; background: #ff4b2b; bottom: -100px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 250px; height: 250px; background: #f9d423; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5;}

        @keyframes floatOrb {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        /* 2. The "Unwrap" Screen */
        #intro-screen {
            position: absolute;
            z-index: 50;
            text-align: center;
            transition: opacity 1s ease, transform 1s ease;
        }

        .unwrap-btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(255, 65, 108, 0.6);
            animation: pulseBtn 2s infinite;
            transition: transform 0.3s ease;
        }

        .unwrap-btn:hover {
            transform: scale(1.1);
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 20px rgba(255, 65, 108, 0.4); }
            50% { box-shadow: 0 0 40px rgba(255, 65, 108, 0.8), 0 0 15px rgba(255, 255, 255, 0.5); }
            100% { box-shadow: 0 0 20px rgba(255, 65, 108, 0.4); }
        }

        /* 3. The Glassmorphism Card (Hidden initially) */
        #main-card {
            display: none;
            width: 90%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateY(50px) scale(0.9);
        }

        /* Reveal Animation for the card */
        .show-card {
            display: block !important;
            animation: revealCard 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes revealCard {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* 4. Card Content Styling */
        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 3.5rem;
            color: #ffd700; /* Gold */
            margin: 0 0 5px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        h2 {
            font-weight: 300;
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        .photo-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 25px auto;
        }

        .photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
            /* Smooth floating animation */
            animation: floatImage 4s ease-in-out infinite;
        }

        @keyframes floatImage {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); box-shadow: 0 15px 30px rgba(255, 255, 255, 0.4); }
            100% { transform: translateY(0px); }
        }

        .typewriter-text {
            font-size: 1.05rem;
            line-height: 1.7;
            color: #f1f1f1;
            min-height: 100px; /* Prevents card jumping */
            margin-bottom: 20px;
        }

        .signature {
            font-family: 'Great Vibes', cursive;
            font-size: 2rem;
            color: #ff416c;
            opacity: 0; /* Fades in via JS */
            transition: opacity 1s ease;
        }
    </style>
</head>
<body>

    <!-- Background Glowing Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    <div class="bg-orb orb-3"></div>

    <!-- Screen 1: The Intro Button -->
    <div id="intro-screen">
        <button class="unwrap-btn" onclick="revealSurprise()">Tap to open your gift 🎁</button>
    </div>

    <!-- Screen 2: The Main Animated Card -->
    <div id="main-card">
        <h1>Happy Rakhi</h1>
        <h2>Shambhavi</h2>
        
        <div class="photo-container">
            <!-- *** REPLACE 'your-photo.jpg' WITH YOUR ACTUAL IMAGE FILENAME *** -->
            <img class="photo" src="pic3.jpg" alt="Our Photo">
        </div>
        
        <!-- The message will automatically type itself here -->
        <div class="typewriter-text" id="message"></div>
        
        <div class="signature" id="signature">Love, Vijay ❤️</div>
    </div>

    <!-- JavaScript to handle animations and typewriter effect -->
    <script>
        // The secret message
        const textToType = "Thank you for being my built-in best friend, my protector, and the most annoying person I love. I coded this just for you today. You mean the world to me!";
        const speed = 50; // Typing speed in milliseconds
        let i = 0;

        function revealSurprise() {
            // 1. Hide the button
            const intro = document.getElementById('intro-screen');
            intro.style.opacity = '0';
            intro.style.transform = 'scale(0.8)';
            
            setTimeout(() => {
                intro.style.display = 'none';
                
                // 2. Show the card with animation
                const card = document.getElementById('main-card');
                card.classList.add('show-card');
                
                // 3. Start the typewriter effect after the card reveals
                setTimeout(typeWriter, 1000);
            }, 800); // Wait for fade out
        }

        function typeWriter() {
            if (i < textToType.length) {
                document.getElementById("message").innerHTML += textToType.charAt(i);
                i++;
                setTimeout(typeWriter, speed);
            } else {
                // Fade in the signature after typing finishes
                document.getElementById("signature").style.opacity = '1';
            }
        }
    </script>

</body>
</html>
